# The portfolio now lives in GalvareyPoco/galvareypoco.github.io and is served at
# https://galvareypoco.github.io/. This keeps the old /GalvareyPoco/ address
# redirecting there.
name: Redirect old site URL

on:
  push:
    branches: [main]
    paths: ["pages-redirect/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
